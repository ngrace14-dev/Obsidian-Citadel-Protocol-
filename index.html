<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency | Website Discovery</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="text-slate-300 antialiased min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 relative overflow-hidden">
    
    <!-- Background Glow Effects -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-cyan-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-3xl glass-panel rounded-2xl overflow-hidden relative shadow-2xl p-8 sm:p-16 text-center z-10">
        
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-slate-800 border border-slate-700 mb-8 shadow-lg">
            <svg class="w-10 h-10 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        
        <h1 class="text-4xl sm:text-5xl font-bold text-white tracking-tight mb-6">Build Your Digital Presence</h1>
        
        <p class="text-slate-400 text-lg sm:text-xl mb-10 max-w-2xl mx-auto leading-relaxed">
            Welcome to the Client Portal. We use a transparent discovery process to determine the exact scope, strategy, and investment required for your build before we start.
        </p>

        <!-- LINK TO INTAKE FORM HERE -->
        <a href="intake_form.html" class="inline-flex items-center justify-center bg-cyan-600 text-white px-8 py-4 rounded-lg font-bold text-lg hover:bg-cyan-500 transition-all shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)]">
            Start Project Discovery <span class="ml-2">→</span>
        </a>

        <div class="mt-12 pt-8 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-center gap-6 text-sm text-slate-500">
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Instant Pricing Estimates
            </div>
            <div class="flex items-center">
                <svg class="w-5 h-5 mr-2 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Transparent Scoping
            </div>
        </div>

    </main>

</body>
</html>
